[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spotiflac-bot"
version = "0.1.0"
description = "Telegram bot that downloads lossless FLAC from Spotify links via SpotiFLAC"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "python-dotenv>=1.2.3",
    "python-telegram-bot[job-queue]>=21.0",
    "spotiflac>=4.2.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[project.scripts]
spotiflac-bot = "spotiflac_bot.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
